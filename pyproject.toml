[project]
name = "playtest-lens"
version = "0.1.0"
description = "A dashcam and bug reporter for game testers"
requires-python = ">=3.10"
dependencies = ["pynput>=1.7"]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
lens = "lens.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
packages = ["lens"]
