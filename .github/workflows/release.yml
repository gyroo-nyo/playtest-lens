name: Release
on:
  push:
    tags: ['v*']
permissions:
  contents: write
jobs:
  windows-installer:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install . pyinstaller
      - name: Bundle adb and ffmpeg
        shell: pwsh
        run: |
          New-Item -ItemType Directory tools | Out-Null
          Invoke-WebRequest https://dl.google.com/android/repository/platform-tools-latest-windows.zip -OutFile pt.zip
          Expand-Archive pt.zip pt
          Copy-Item pt/platform-tools/adb.exe, pt/platform-tools/AdbWinApi.dll, pt/platform-tools/AdbWinUsbApi.dll tools/
          Copy-Item pt/platform-tools/NOTICE.txt tools/adb-NOTICE.txt
          Invoke-WebRequest https://github.com/BtbN/FFmpeg-Builds/releases/download/latest/ffmpeg-master-latest-win64-gpl.zip -OutFile ff.zip
          Expand-Archive ff.zip ff
          $d = (Get-ChildItem ff -Directory)[0].FullName
          Copy-Item "$d/bin/ffmpeg.exe", "$d/bin/ffprobe.exe" tools/
          Copy-Item "$d/LICENSE.txt" tools/ffmpeg-LICENSE.txt
      - name: Build the app
        shell: pwsh
        run: |
          pyinstaller --noconfirm --onedir --console --name PlaytestLens --icon packaging/windows/lens.ico `
            --add-data "lens/web;lens/web" --add-data "lens/ocr;lens/ocr" `
            --hidden-import pynput.keyboard._win32 --hidden-import pynput.mouse._win32 --collect-submodules lens `
            packaging/windows/launch.py
          Copy-Item -Recurse tools dist/PlaytestLens/tools
      - name: Smoke test
        shell: pwsh
        env:
          LENS_NO_PAUSE: "1"
        run: |
          dist/PlaytestLens/tools/ffmpeg.exe -version | Select-Object -First 1
          dist/PlaytestLens/PlaytestLens.exe devices
          if ($LASTEXITCODE -ne 0) { exit 1 }
      - name: Build the installer
        shell: pwsh
        run: |
          choco install innosetup -y --no-progress
          $v = "${{ github.ref_name }}".TrimStart('v')
          & "${env:ProgramFiles(x86)}\Inno Setup 6\iscc.exe" "/DMyVersion=$v" packaging/windows/setup.iss
      - uses: softprops/action-gh-release@v2
        with:
          files: Output/PlaytestLens-Setup.exe
          body: |
            **Windows:** download `PlaytestLens-Setup.exe` below and run it. adb and ffmpeg come with it; no Python needed.
            Windows may say "Windows protected your PC" (the app isn't signed): click **More info → Run anyway**.

            Then turn on **USB debugging** on the phone (Settings → About phone → tap Build number 7 times → Developer options),
            plug it in, allow the computer on the phone, and open Playtest Lens. The first time it asks for the game's
            package name (e.g. `superfusion.gfl`). Bugs are saved in Documents\Playtest Lens\bugs.

            **Mac:** see the README.

            Bundled: Android platform-tools (adb) and FFmpeg (GPL, build by BtbN: https://github.com/BtbN/FFmpeg-Builds); their licenses are in the `tools` folder.
