<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Playtest Lens ident</title>
<!--
  STYLE BRIEF — Playtest Lens, the long cut (40 s)
  Feeling: quick, playful, clever — made for game devs. Concept: one feature shown start to finish (the late F8 and the
    rewind), then a tour of the dashboard it lands in: six bugs caught by themselves on the beat, the report that writes
    itself, the regression checks on a new build, then everything turns to pixels and becomes the sword logo, which
    drops back into the hero's hand (loop).
  Acts: 0–13 late F8 + rewind + bug card · 13–25 the feed fills (CRASH, FREEZE, JANK, TEXT, VISUAL, CLOSED, seen ×2)
    · 25–28 the report · 28–32 checks on build b32 · 32–34 the whole dashboard · 34–40 logo, wordmark, back into the game.
  Palette (Lens DESIGN.md "Bitmap Specimen"): ultramarine #3340FF, paper #F4F4F1, ink #0A0A0A; the dashboard's own chip
    colours (error #C8102E, caution #8A5A00, advisory #1F5F8B); logo gold #E0A92A; missing-texture magenta #FF00FF.
  Type: Pixelify Sans (game-world words) + Rajdhani / Saira / IBM Plex Mono (Lens UI and wordmark, the product's own).
  Backgrounds: paper → ink (F8, cut) → ultramarine (rewind, flooded from the key) → paper (the dashboard, dithered)
    → ink (logo, dithered) → paper (loop). A grid that drifts with the camera, soft light, grain.
  Signature motion: pixel snap — moves land in hard steps; changes are Bayer-dither dissolves; each catch is a chip
    STAMP that slams onto the game and flies into the feed.
  Sound: the game's own chiptune runs the whole way; each bug bends it (cut, freeze, stutter, crush, tape stop).
  Special moment (once): the tape rewind.
  No GFL anything; the game is drawn here from scratch. Every frame is a pure function of t (no Date.now/Math.random).
-->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Pixelify+Sans:wght@600;700&family=Rajdhani:wght@700&family=Saira:wght@500&family=IBM+Plex+Mono:wght@500;600&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.5/gsap.min.js"></script>
<style>
  html, body { margin: 0; height: 100%; background: #0a0a0a; overflow: hidden; }
  #stage { position: absolute; left: 50%; top: 50%; width: 1920px; height: 1080px; transform-origin: 50% 50%; }
  #c { display: block; width: 1920px; height: 1080px; }
  #ui { display: none; position: fixed; left: 16px; right: 16px; bottom: 16px; gap: 12px; align-items: center;
        font: 500 14px/1 "IBM Plex Mono", monospace; color: #f4f4f1; }
  #ui.on { display: flex; }
  #ui input { flex: 1; } #ui button { font: inherit; }
</style>
</head>
<body>
<div id="stage"><canvas id="c" width="1920" height="1080"></canvas></div>
<div id="ui"><button id="btn">Pause</button><input id="scrub" type="range" min="0" max="1000" value="0"><span id="clock">0.00s</span></div>
<script>
'use strict';
const W = 1920, H = 1080, D = 40, SR = 44100;
const Q = new URLSearchParams(location.search);
const GRAIN = !Q.has('gif');
const cv = document.getElementById('c'), ctx = cv.getContext('2d');
const COL = { paper: '#f4f4f1', paper2: '#e8e8e3', ink: '#0a0a0a', grey: '#5c5c58', blue: '#3340ff', blueD: '#1c23a8',
  blueL: '#8f97ff', red: '#ff2b2b', gold: '#e0a92a', goldL: '#ffd866', mag: '#ff00ff', orange: '#ff7a1a', onInk: '#2a2a2e',
  pass: '#2E7A32', fail: '#C8102E' };
const F = { pix: '"Pixelify Sans", monospace', head: 'Rajdhani, "Arial Narrow", sans-serif', body: 'Saira, system-ui, sans-serif',
  mono: '"IBM Plex Mono", ui-monospace, monospace' };

/* ---------- math ---------- */
const clamp = (x, a = 0, b = 1) => Math.min(b, Math.max(a, x));
const lerp = (a, b, p) => a + (b - a) * p;
const fr = x => x - Math.floor(x);
const E = { lin: p => p, o2: p => 1 - (1 - p) * (1 - p), o4: p => 1 - Math.pow(1 - p, 4), i2: p => p * p,
  io: p => p < .5 ? 2 * p * p : 1 - Math.pow(-2 * p + 2, 2) / 2,
  io3: p => p < .5 ? 4 * p * p * p : 1 - Math.pow(-2 * p + 2, 3) / 2 };
const ST = (n, e = E.o4) => p => p >= 1 ? 1 : Math.floor(e(p) * n) / n;    // the pixel snap: eased, then landed in n hard steps
const seg = (t, a, b) => clamp((t - a) / (b - a));
function K(t, k) {                                                         // keyframes [[time, value, ease]]; equal times = a cut
  if (t < k[0][0]) return k[0][1];
  for (let i = 1; i < k.length; i++) if (t < k[i][0]) { const a = k[i - 1], b = k[i]; return lerp(a[1], b[1], (b[2] || E.io)((t - a[0]) / (b[0] - a[0]))); }
  return k[k.length - 1][1];
}
const hash = (a, b = 0, c = 0) => fr(Math.sin(a * 127.1 + b * 311.7 + c * 74.7) * 43758.5453);
const mk = (w, h) => { const c = document.createElement('canvas'); c.width = w; c.height = h; return c; };
function rr(x, c, y, w, h, r) { c.beginPath(); c.roundRect(x, y, w, h, r); }
function fitText(c, s, x, y, max) {                       // one line, cut with an ellipsis when it doesn't fit
  if (c.measureText(s).width <= max) return c.fillText(s, x, y);
  while (s.length > 1 && c.measureText(s + '…').width > max) s = s.slice(0, -1);
  c.fillText(s + '…', x, y);
}

/* ---------- the bugs the feed catches (Lens's own chip names and colours) ---------- */
const KINDS = {
  manual: { chip: 'MARKED', fg: '#0a0a0a', bg: '#f4f4f1' },
  crash: { chip: 'CRASH', fg: '#C8102E', bg: '#FDECEE' }, closed: { chip: 'CLOSED', fg: '#C8102E', bg: '#FDECEE' },
  freeze: { chip: 'FREEZE', fg: '#8A5A00', bg: '#FFF0C2' }, lag: { chip: 'JANK', fg: '#8A5A00', bg: '#FFF0C2' },
  text: { chip: 'TEXT', fg: '#1F5F8B', bg: '#E6F0F7' }, glitch: { chip: 'VISUAL', fg: '#1F5F8B', bg: '#E6F0F7' } };
const BEATS = [[15.0, 'crash'], [16.5, 'freeze'], [18.0, 'lag'], [19.5, 'text'], [21.0, 'glitch'], [22.5, 'closed']];
const REPEAT = 24.0;                                        // the crash again: seen ×2
const beatAt = t => BEATS.find(([b]) => t >= b && t < b + 1.5);
const TITLES = { crash: 'NullReferenceException', freeze: 'Froze for 3 s', lag: '12 fps, 0.4 s stutter', text: 'MENU_START_TITLE',
  glitch: 'Missing texture, 6%', closed: 'Closed, no crash' };
const FEED = [{ k: 'manual', t: 13.45, title: 'Hero stuck in the wall', time: '14:06' }]
  .concat(BEATS.map(([b, k], i) => ({ k, t: b + 1.25, title: TITLES[k], time: ['14:07', '14:09', '14:11', '14:12', '14:14', '14:16'][i] })));

/* ---------- the game clock: the whole dungeon is drawGame(g) ---------- */
function gameClock(t) {
  if (t < 6.7) return t;                                    // play → F8
  if (t < 8.7) return lerp(6.7, 3.9, E.io3((t - 6.7) / 2)); // the rewind
  if (t < 13.1) return 3.9;                                 // frozen on the bug
  if (t < 34.2) {                                           // the dashboard: the hero walks on
    let tt = t;
    if (t >= 16.6 && t < 17.5) tt = 16.6;                   // FREEZE: nothing moves
    else if (t >= 18.1 && t < 18.9) tt = 18.1 + Math.floor((t - 18.1) / .3) * .15;   // JANK: half speed, in lumps
    return tt - 13.1 + 5;
  }
  if (t < 38) return 3.9;
  return t - D;                                             // the loop's lead-in idles before g = 0
}

/* ---------- pixel sprites (auto-outlined) ---------- */
const PAL = { h: '#6b3d1e', s: '#f0c090', e: '#0a0a0a', y: '#e0a92a', t: '#3340ff', T: '#5b3a1c', b: '#3a2a1c',
  g: '#5fd068', G: '#2e8b47', w: '#ffffff', k: '#0a0a0a' };
function sprite(rows, paint) {
  const h = rows.length, w = rows[0].length, c = mk(w + 2, h + 2), x = c.getContext('2d');
  const on = (i, j) => j >= 0 && j < h && i >= 0 && i < w && rows[j][i] !== '.';
  for (let j = -1; j <= h; j++) for (let i = -1; i <= w; i++) {
    const inside = on(i, j), edge = !inside && (on(i + 1, j) || on(i - 1, j) || on(i, j + 1) || on(i, j - 1));
    if (!inside && !edge) continue;
    x.fillStyle = paint ? paint(i + 1, j + 1) : inside ? PAL[rows[j][i]] : PAL.k;
    x.fillRect(i + 1, j + 1, 1, 1);
  }
  return c;
}
const HERO_TOP = ['...hhhh...', '.hhhhhhhh.', '.hhhhhhhh.', '.hssssssh.', '.hsessesh.', '..ssssss..', '..yyyyyy..',
  '.tttttttt.', 'stttttttts', '.TTTTTTTT.'];
const HERO = [['..bb..bb..', '..bb..bb..'], ['..bb..bb..', '..bb......'], ['..bb..bb..', '......bb..']]
  .map(legs => sprite(HERO_TOP.concat(legs)));
const SLIME_ROWS = ['...gggg...', '..gggggg..', '.gggggggg.', '.gwkggwkg.', 'gggggggggg', 'gggggggggg', '.GGGGGGGG.'];
const SLIME = sprite(SLIME_ROWS);
const SLIME_MT = sprite(SLIME_ROWS, (i, j) => ((i >> 1) + (j >> 1)) % 2 ? COL.mag : '#000');   // missing texture
const white = src => { const c = mk(src.width, src.height), x = c.getContext('2d'); x.drawImage(src, 0, 0);
  x.globalCompositeOperation = 'source-in'; x.fillStyle = '#fff'; x.fillRect(0, 0, c.width, c.height); return c; };
const HERO_W = white(HERO[0]), SLIME_W = white(SLIME);

/* ---------- the dungeon ---------- */
const GW = 240, GH = 108;
const gc = mk(GW, GH), g2 = gc.getContext('2d');
const SLIME_X = 226, SLIME_Y = 80, SIGN_X = 480;
function heroAt(g) {          // feet position in dungeon pixels; cx = the un-jittered x the view follows
  let x = 100, y = 78, walk = 0, stuck = false, pop = 0, sword = 'ur';
  if (g >= .4 && g < 2) { x = 100 + (g - .4) / 1.6 * 90; walk = 1 + Math.floor(g * 8) % 2; }
  else if (g >= 2 && g < 2.6) { x = 190; }
  else if (g >= 2.6 && g < 3.05) { const p = (g - 2.6) / .45; x = 190 + p * 10; y = 78 - p * 47; walk = 1 + Math.floor(g * 10) % 2; }
  else if (g >= 3.05 && g < 4.6) { x = 200; y = 31; stuck = true; walk = 1 + Math.floor(g * 12) % 2; sword = Math.floor(g * 6) % 2 ? 'up' : 'ur'; }
  else if (g >= 4.6) { x = 200 + Math.max(0, g - 4.75) * 45; walk = g > 4.75 ? 1 + Math.floor(g * 8) % 2 : 0; pop = g < 4.75 ? 1 : 0; }
  const jit = stuck ? (Math.floor(g * 24) % 2 ? 1 : -1) : 0;
  return { x: x + jit, y, cx: x, walk, stuck, pop, sword };
}
const viewX = g => Math.round(clamp(heroAt(g).cx - 100, 0, 1e5));
const DIRS = { up: [0, -1], ur: [1, -1], r: [1, 0], dr: [1, 1] };
function drawSword(c, hx, hy, d) {
  const [dx, dy] = DIRS[d], gx = hx + dx, gy = hy + dy, qx = -dy, qy = dx;
  const pts = [[hx, hy, '#5b3a1c'], [gx, gy, COL.gold], [gx + qx, gy + qy, COL.gold], [gx - qx, gy - qy, COL.gold]];
  for (let i = 2; i <= 7; i++) pts.push([hx + dx * i, hy + dy * i, i === 7 ? '#ffffff' : '#e8eef4']);
  c.fillStyle = COL.ink; for (const [x, y] of pts) c.fillRect(x - 1, y - 1, 3, 3);
  for (const [x, y, col] of pts) { c.fillStyle = col; c.fillRect(x, y, 1, 1); }
}
function drawGame(g, mag = 0) {    // mag: how far the VISUAL glitch's missing-texture patch has spread (0..1)
  const c = g2, hero = heroAt(g), cam = viewX(g);
  c.fillStyle = '#262a3a'; c.fillRect(0, 0, GW, GH);
  // floor
  for (let ty = 24; ty < 96; ty += 12) for (let tx = -(cam % 12); tx < GW; tx += 12) {
    const wi = Math.floor((tx + cam) / 12), wj = ty / 12, v = hash(wi, wj);
    const patch = mag > 0 && Math.abs(tx + 6 - 186) / 12 + Math.abs(ty + 6 - 84) / 12 * 1.4 < mag * 2.8;
    if (patch) { for (let j = 0; j < 12; j += 2) for (let i = 0; i < 12; i += 2) { c.fillStyle = ((i + j) / 2) % 2 ? COL.mag : '#000'; c.fillRect(tx + i, ty + j, 2, 2); } continue; }
    c.fillStyle = v < .33 ? '#2c3144' : v < .66 ? '#30364a' : '#2a2f41'; c.fillRect(tx, ty, 12, 12);
    c.fillStyle = '#22263a'; c.fillRect(tx, ty, 12, 1); c.fillRect(tx, ty, 1, 12);
    c.fillStyle = '#383e55'; c.fillRect(tx + 1, ty + 1, 10, 1);
    if (v > .82) { c.fillStyle = '#20243a'; c.fillRect(tx + 4, ty + 5, 3, 1); c.fillRect(tx + 6, ty + 6, 2, 1); c.fillRect(tx + 7, ty + 7, 1, 2); }
  }
  c.fillStyle = 'rgba(0,0,0,.35)'; c.fillRect(0, 24, GW, 3);
  const torches = []; for (let k = Math.floor(cam / 84) - 1; k <= Math.floor(cam / 84) + 4; k++) { const wx = 30 + 84 * k; if (Math.abs(wx - (SIGN_X + 32)) > 44) torches.push([k, wx - cam]); }
  for (const [k, sx] of torches) {                         // torch light on the floor
    const f = .05 + .015 * Math.sin(g * 17 + k * 2);
    c.fillStyle = `rgba(255,190,90,${f})`;
    for (const [rx, ry] of [[26, 12], [18, 8], [10, 5]]) { c.beginPath(); c.ellipse(sx, 30, rx, ry, 0, 0, Math.PI * 2); c.fill(); }
  }
  // bottom wall
  for (let by = 96; by < 108; by += 6) for (let bx = -(cam % 12) - (by % 12 ? 6 : 0); bx < GW; bx += 12) {
    const v = hash(Math.floor((bx + cam) / 6), by); c.fillStyle = v < .5 ? '#3c4155' : '#363b4e'; c.fillRect(bx, by, 11, 5);
  }
  c.fillStyle = '#4a5068'; c.fillRect(0, 96, GW, 1);
  // slime
  const ss = SLIME_X - cam - 6;
  if (g < 2.45) {
    const hop = Math.round(Math.abs(Math.sin(g * Math.PI * 2.5)) * 4);
    c.drawImage(SLIME, ss, SLIME_Y - 9 - hop);
  } else if (g < 2.6) {
    c.drawImage(SLIME_W, ss + 3, SLIME_Y - 9);
  } else if (g < 4.6) {                                    // the bug: missing-texture magenta, tearing by row
    const k = Math.floor(g * 12);
    for (let r = 0; r < SLIME_MT.height; r++) {
      const off = hash(r, k) > .7 ? Math.round((hash(r, k, 3) - .5) * 10) : 0;
      c.drawImage(SLIME_MT, 0, r, SLIME_MT.width, 1, ss + 3 + off, SLIME_Y - 9 + r, SLIME_MT.width, 1);
    }
    c.fillStyle = COL.mag;
    for (let i = 0; i < 12; i++) if (hash(i, Math.floor(g * 8)) > .45)
      c.fillRect(ss - 10 + Math.floor(hash(i, 1, Math.floor(g * 8)) * 34), SLIME_Y - 22 + Math.floor(hash(i, 2, Math.floor(g * 8)) * 22), 2, 2);
  } else if (g < 4.95) {
    const u = (g - 4.6) / .35; c.fillStyle = COL.mag;
    for (let i = 0; i < 8; i++) { const a = i / 8 * Math.PI * 2; c.fillRect(Math.round(ss + 8 + Math.cos(a) * u * 16), Math.round(SLIME_Y - 5 + Math.sin(a) * u * 12), 2, 2); }
  }
  // hero
  const hx = Math.round(hero.x) - cam, hy = Math.round(hero.y);
  c.drawImage(hero.pop ? HERO_W : HERO[hero.walk], hx - 6, hy - 14);
  const sw = [2, 2.2, 2.4].find(s => g >= s && g < s + .15);
  if (sw !== undefined) {
    const u = (g - sw) / .15, d = u < .25 ? 'up' : u < .5 ? 'ur' : u < .75 ? 'r' : 'dr';
    drawSword(c, hx + 4, hy - 5, d);
    c.fillStyle = 'rgba(255,255,255,.9)';
    for (let a = -90; a <= -90 + u * 135; a += 9) c.fillRect(Math.round(hx + 4 + Math.cos(a * Math.PI / 180) * 10), Math.round(hy - 5 + Math.sin(a * Math.PI / 180) * 10), 1, 1);
  } else drawSword(c, hx + 4, hy - 5, hero.sword);
  if (hero.pop) { c.fillStyle = '#fff'; for (const [a, b] of [[-9, -8], [9, -10], [-7, 2], [10, 1]]) c.fillRect(hx + a, hy - 6 + b, 1, 1); }
  // top wall, drawn last: it covers a hero who has walked into it
  for (let by = 0; by < 22; by += 6) for (let bx = -(cam % 12) - (by % 12 ? 6 : 0); bx < GW; bx += 12) {
    const v = hash(Math.floor((bx + cam) / 6), by, 5);
    c.fillStyle = '#2c3042'; c.fillRect(bx, by, 12, 6);
    c.fillStyle = v < .4 ? '#565c74' : v < .8 ? '#4e546b' : '#5f6680'; c.fillRect(bx, by, 11, 5);
    c.fillStyle = '#6a7190'; c.fillRect(bx, by, 11, 1);
  }
  c.fillStyle = '#1f2230'; c.fillRect(0, 22, GW, 2);
  if (hero.stuck) { c.globalAlpha = .55; c.drawImage(HERO[hero.walk], 0, 0, 12, 24 - (hy - 14), hx - 6, hy - 14, 12, 24 - (hy - 14)); c.globalAlpha = 1; }   // half inside the bricks
  for (const [k, sx] of torches) {
    c.fillStyle = COL.ink; c.fillRect(sx - 2, 10, 4, 8); c.fillStyle = '#6b3d1e'; c.fillRect(sx - 1, 11, 2, 6);
    const fl = Math.floor(g * 10 + k * 3) % 3;
    c.fillStyle = '#ff9a3c'; c.fillRect(sx - 2, 5 - (fl === 1), 4, 5);
    c.fillStyle = COL.goldL; c.fillRect(sx - 1, 6 + (fl === 2), 2, 3);
    c.fillStyle = '#fff3c4'; c.fillRect(sx - (fl === 0), 8, 1, 1);
  }
  const sx = SIGN_X - cam;                                  // a wooden sign; its words are drawn crisp by drawScreen
  if (sx > -70 && sx < GW + 4) { c.fillStyle = COL.ink; c.fillRect(sx - 1, 4, 66, 15); c.fillStyle = '#8a5a2b'; c.fillRect(sx, 5, 64, 13);
    c.fillStyle = '#a8723a'; c.fillRect(sx, 5, 64, 1); c.fillStyle = '#5b3a1c'; c.fillRect(sx, 17, 64, 1); c.fillRect(sx + 3, 8, 1, 1); c.fillRect(sx + 60, 8, 1, 1); }
}
const frozen = mk(GW, GH);
drawGame(3.9); frozen.getContext('2d').drawImage(gc, 0, 0);
